<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>responsive-table-widget</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--? test pulling data -->
    <!--? test mount options -->
    <!-- test url params -->
    <!-- can generate embed markup for user with selected options -->

    <div id="responsive-table"></div>

    <script src="https://chancellor-whitaker.github.io/responsive-table-widget/responsive-table-widget.iife.js"></script>

    <script>
      ResponsiveTableWidget.mount("#responsive-table", {
        dataUrl:
          "https://irserver2.eku.edu/Apps/DataPage/PROD/Accreditation/ATMAE/data",

        transformData(rawData) {
          const rows = rawData.Degrees;

          const snakeToTitle = (str) =>
            str
              .split("_")
              .map(
                (word) =>
                  word.charAt(0).toUpperCase() + word.slice(1).toLowerCase(),
              )
              .join(" ");

          const columns = Object.keys(rows[0]).map((key) => ({
            key,
            label: snakeToTitle(key),
          }));

          return { columns, rows };
        },
      });
    </script>
  </body>
</html>
